<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ИдёмВКино - Администратирование</title>
      <link rel="stylesheet" href="css/admin.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>

  <body >
    <header class="header">
      <div class="header-top login-page">
        <a href="../index.html" class="logo">
          <img src="../img/лого.png" alt="ИдемВКино">
        </a>
        <div class="admin-subtitle">Администраторррская</div>
      </div>
    </header>

    <main class="login-page">
      <section class="admin-block login-block">
        <button class="admin-title">АВТОРИЗАЦИЯ</button>

        <div class="admin-content">
          <form id="login-form" class="login-form">
            <label class="login-label">
              <span>E-mail</span>
              <input type="text" name="login" placeholder="example@domain.xyz" required  autofocus />
            </label>

            <label class="login-label">
              <span>Пароль</span>
              <input type="password" name="password" required />
            </label>

            <button type="submit" class="btn primary login-btn">
              АВТОРИЗИРОВАТЬСЯ
            </button>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
